<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeScale - Suivi de Ruche Connectée</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent-gold: #f59e0b;
      --accent-amber: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --status-online: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px 30px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); flex-wrap: wrap; gap: 16px; }
    .logo-container { display: flex; align-items: center; gap: 16px; }
    .logo-icon { font-size: 2.2rem; background: rgba(245, 158, 11, 0.15); padding: 10px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3); }
    h1 { font-size: 1.8rem; color: var(--accent-gold); }
    .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); color: var(--status-online); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.875rem; font-weight: 600; }
    .status-dot { width: 10px; height: 10px; background-color: var(--status-online); border-radius: 50%; box-shadow: 0 0 10px var(--status-online); }
    
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn:hover, .btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
    .hive-select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 10px; font-weight: 600; outline: none; cursor: pointer; }

    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .metric-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; }
    .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-gold); }
    .card-title { font-size: 0.875rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    .card-value { font-size: 3rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
    .card-unit { font-size: 1.25rem; color: var(--accent-gold); }
    .card-trend { margin-top: 12px; font-size: 0.85rem; color: #10b981; }
    .chart-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <span class="logo-icon">🐝</span>
        <div>
          <h1>BeeScale</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Suivi de ruche connecté</p>
        </div>
      </div>
      <div class="status-badge"><span class="status-dot"></span>Balance connectée</div>
    </header>

    <div class="controls">
      <select class="hive-select" id="hiveSelector" onchange="changeHive(this.value)">
        <option value="ruche1">🐝 Ruche N° 1 (Verger)</option>
        <option value="ruche2">🐝 Ruche N° 2 (Jardin)</option>
      </select>
      <button class="btn active" onclick="updateTimeframe('7d', this)">7 Derniers Jours</button>
      <button class="btn" onclick="updateTimeframe('24h', this)">Dernières 24h</button>
      <button class="btn" onclick="refreshData()">🔄 Rafraîchir</button>
    </div>

    <div class="grid-metrics">
      <div class="metric-card">
        <div class="card-title">Poids Total</div>
        <div class="card-value"><span id="weight">42.8</span><span class="card-unit">kg</span></div>
        <div class="card-trend" id="weightTrend">↑ +0.3 kg depuis 24h</div>
      </div>
      <div class="metric-card">
        <div class="card-title">Température Couvain</div>
        <div class="card-value"><span id="temp">35.1</span><span class="card-unit">°C</span></div>
        <div class="card-trend">● Régulation optimale</div>
      </div>
      <div class="metric-card">
        <div class="card-title">Hygrométrie</div>
        <div class="card-value"><span id="humidity">58</span><span class="card-unit">%</span></div>
        <div class="card-trend">● Stable</div>
      </div>
    </div>

    <div class="chart-section">
      <h3 id="chartTitle">Historique des 7 derniers jours</h3>
      <canvas id="scaleChart" height="100"></canvas>
    </div>
    <footer><p>BeeScale &copy; 2026</p></footer>
  </div>

  <script>
    const dataHives = {
      ruche1: {
        weight: "42.8",
        temp: "35.1",
        humidity: "58",
        labels7d: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
        data7d: [41.2, 41.5, 41.8, 42.1, 42.3, 42.5, 42.8],
        labels24h: ['00h', '04h', '08h', '12h', '16h', '20h'],
        data24h: [42.5, 42.5, 42.6, 42.7, 42.8, 42.8]
      },
      ruche2: {
        weight: "38.2",
        temp: "34.8",
        humidity: "62",
        labels7d: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
        data7d: [36.5, 36.8, 37.1, 37.4, 37.8, 38.0, 38.2],
        labels24h: ['00h', '04h', '08h', '12h', '16h', '20h'],
        data24h: [38.0, 38.0, 38.1, 38.1, 38.2, 38.2]
      }
    };

    let currentHive = 'ruche1';
    let currentTimeframe = '7d';

    const ctx = document.getElementById('scaleChart').getContext('2d');
    const scaleChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dataHives[currentHive].labels7d,
        datasets: [{ label: 'Poids (kg)', data: dataHives[currentHive].data7d, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.3 }]
      },
      options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
    });

    function changeHive(hiveKey) {
      currentHive = hiveKey;
      document.getElementById('weight').innerText = dataHives[hiveKey].weight;
      document.getElementById('temp').innerText = dataHives[hiveKey].temp;
      document.getElementById('humidity').innerText = dataHives[hiveKey].humidity;
      updateChart();
    }

    function updateTimeframe(tf, btnElement) {
      currentTimeframe = tf;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
      document.getElementById('chartTitle').innerText = tf === '7d' ? 'Historique des 7 derniers jours' : 'Évolution sur 24h';
      updateChart();
    }

    function updateChart() {
      const hive = dataHives[currentHive];
      if (currentTimeframe === '7d') {
        scaleChart.data.labels = hive.labels7d;
        scaleChart.data.datasets[0].data = hive.data7d;
      } else {
        scaleChart.data.labels = hive.labels24h;
        scaleChart.data.datasets[0].data = hive.data24h;
      }
      scaleChart.update();
    }

    function refreshData() {
      const currentVal = parseFloat(document.getElementById('weight').innerText);
      const newVal = (currentVal + (Math.random() * 0.2 - 0.1)).toFixed(1);
      document.getElementById('weight').innerText = newVal;
    }
  </script>
</body>
</html>
