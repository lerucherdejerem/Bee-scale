<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeScale - Suivi de Ruche Connectée</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --status-online: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px 30px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); flex-wrap: wrap; gap: 16px; }
    .logo-container { display: flex; align-items: center; gap: 16px; }
    .logo-icon { font-size: 2.2rem; background: rgba(245, 158, 11, 0.15); padding: 10px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3); }
    h1 { font-size: 1.8rem; color: var(--accent-gold); }
    .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); color: var(--status-online); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.875rem; font-weight: 600; }
    .status-dot { width: 10px; height: 10px; background-color: var(--status-online); border-radius: 50%; box-shadow: 0 0 10px var(--status-online); }
    
    .controls { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn:hover, .btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
    .btn-add { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
    .btn-edit { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border-color: rgba(59, 130, 246, 0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }
    .hive-select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 10px; font-weight: 600; outline: none; cursor: pointer; }

    .modal { display: none; background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; margin-bottom: 24px; gap: 10px; align-items: center; flex-wrap: wrap; }
    .modal input { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 8px; outline: none; width: 160px; }

    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .metric-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; }
    .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-gold); }
    .card-title { font-size: 0.875rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    .card-value { font-size: 3rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
    .card-unit { font-size: 1.25rem; color: var(--accent-gold); }
    .card-trend { margin-top: 12px; font-size: 0.85rem; color: #10b981; }
    .chart-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <span class="logo-icon">🐝</span>
        <div>
          <h1>BeeScale</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Suivi de ruche connecté</p>
        </div>
      </div>
      <div class="status-badge"><span class="status-dot"></span>Balance connectée</div>
    </header>

    <div class="controls">
      <select class="hive-select" id="hiveSelector" onchange="changeHive(this.value)"></select>
      <button class="btn btn-add" onclick="toggleAddForm()">➕ Ajouter ruche</button>
      <button class="btn btn-edit" onclick="toggleEditForm()">✏️ Saisir mesures</button>
      <button class="btn btn-danger" onclick="deleteCurrentHive()">🗑️ Supprimer</button>
      <button class="btn active" id="btn7d" onclick="updateTimeframe('7d', this)">7 Jours</button>
      <button class="btn" id="btn24h" onclick="updateTimeframe('24h', this)">24h</button>
    </div>

    <!-- Formulaire d'ajout de ruche -->
    <div class="modal" id="addForm">
      <input type="text" id="newHiveName" placeholder="Nom (ex: Ruche 3)">
      <input type="number" id="newHiveWeight" placeholder="Poids (kg)" step="0.1" value="40.0">
      <button class="btn btn-add" onclick="addNewHive()">Enregistrer</button>
      <button class="btn" onclick="toggleAddForm()">Annuler</button>
    </div>

    <!-- Formulaire de saisie directe des mesures -->
    <div class="modal" id="editForm">
      <input type="number" id="editWeight" placeholder="Poids (kg)" step="0.1">
      <input type="number" id="editTemp" placeholder="Temp (°C)" step="0.1">
      <input type="number" id="editHumidity" placeholder="Humidité (%)">
      <button class="btn btn-edit" onclick="saveDirectValues()">Mettre à jour</button>
      <button class="btn" onclick="toggleEditForm()">Annuler</button>
    </div>

    <div class="grid-metrics">
      <div class="metric-card">
        <div class="card-title">Poids Total</div>
        <div class="card-value"><span id="weight">42.8</span><span class="card-unit">kg</span></div>
        <div class="card-trend">● Valeur enregistrée</div>
      </div>
      <div class="metric-card">
        <div class="card-title">Température Couvain</div>
        <div class="card-value"><span id="temp">35.1</span><span class="card-unit">°C</span></div>
        <div class="card-trend">● Régulation optimale</div>
      </div>
      <div class="metric-card">
        <div class="card-title">Hygrométrie</div>
        <div class="card-value"><span id="humidity">58</span><span class="card-unit">%</span></div>
        <div class="card-trend">● Stable</div>
      </div>
    </div>

    <div class="chart-section">
      <h3 id="chartTitle">Historique des 7 derniers jours</h3>
      <canvas id="scaleChart" height="100"></canvas>
    </div>
    <footer><p>BeeScale &copy; 2026</p></footer>
  </div>

  <script>
    const defaultHives = {
      ruche1: {
        name: "🐝 Ruche N° 1 (Verger)",
        weight: "42.8",
        temp: "35.1",
        humidity: "58",
        labels7d: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
        data7d: [41.2, 41.5, 41.8, 42.1, 42.3, 42.5, 42.8],
        labels24h: ['00h', '04h', '08h', '12h', '16h', '20h'],
        data24h: [42.5, 42.5, 42.6, 42.7, 42.8, 42.8]
      },
      ruche2: {
        name: "🐝 Ruche N° 2 (Jardin)",
        weight: "38.2",
        temp: "34.8",
        humidity: "62",
        labels7d: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
        data7d: [36.5, 36.8, 37.1, 37.4, 37.8, 38.0, 38.2],
        labels24h: ['00h', '04h', '08h', '12h', '16h', '20h'],
        data24h: [38.0, 38.0, 38.1, 38.1, 38.2, 38.2]
      }
    };

    let dataHives;
    try {
      dataHives = JSON.parse(localStorage.getItem('beescale_hives')) || defaultHives;
    } catch(e) {
      dataHives = defaultHives;
    }

    let currentHive = Object.keys(dataHives)[0] || 'ruche1';
    let currentTimeframe = '7d';
    let scaleChart = null;

    function saveToStorage() {
      try {
        localStorage.setItem('beescale_hives', JSON.stringify(dataHives));
      } catch(e) {}
    }

    function initSelector() {
      const selector = document.getElementById('hiveSelector');
      if (!selector) return;
      selector.innerHTML = '';
      for (let key in dataHives) {
        let opt = document.createElement('option');
        opt.value = key;
        opt.textContent = dataHives[key].name;
        if (key === currentHive) opt.selected = true;
        selector.appendChild(opt);
      }
    }

    function initChart() {
      const canvas = document.getElementById('scaleChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      scaleChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dataHives[currentHive].labels7d,
          datasets: [{ label: 'Poids (kg)', data: dataHives[currentHive].data7d, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.3 }]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
      });
    }

    window.onload = function() {
      initSelector();
      initChart();
      changeHive(currentHive);
    };

    function changeHive(hiveKey) {
      if (!dataHives[hiveKey]) return;
      currentHive = hiveKey;
      document.getElementById('weight').innerText = dataHives[hiveKey].weight;
      document.getElementById('temp').innerText = dataHives[hiveKey].temp;
      document.getElementById('humidity').innerText = dataHives[hiveKey].humidity;
      updateChart();
    }

    function updateTimeframe(tf, btnElement) {
      currentTimeframe = tf;
      document.getElementById('btn7d').classList.remove('active');
      document.getElementById('btn24h').classList.remove('active');
      if (btnElement) btnElement.classList.add('active');
      document.getElementById('chartTitle').innerText = tf === '7d' ? 'Historique des 7 derniers jours' : 'Évolution sur 24h';
      updateChart();
    }

    function updateChart() {
      if (!scaleChart) return;
      const hive = dataHives[currentHive];
      if (!hive) return;
      if (currentTimeframe === '7d') {
        scaleChart.data.labels = hive.labels7d;
        scaleChart.data.datasets[0].data = hive.data7d;
      } else {
        scaleChart.data.labels = hive.labels24h;
        scaleChart.data.datasets[0].data = hive.data24h;
      }
      scaleChart.update();
    }

    function toggleAddForm() {
      document.getElementById('editForm').style.display = 'none';
      const form = document.getElementById('addForm');
      form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleEditForm() {
      document.getElementById('addForm').style.display = 'none';
      const form = document.getElementById('editForm');
      if (form.style.display === 'flex') {
        form.style.display = 'none';
      } else {
        document.getElementById('editWeight').value = dataHives[currentHive].weight;
        document.getElementById('editTemp').value = dataHives[currentHive].temp;
        document.getElementById('editHumidity').value = dataHives[currentHive].humidity;
        form.style.display = 'flex';
      }
    }

    function addNewHive() {
      const nameInput = document.getElementById('newHiveName').value.trim();
      const weightInput = parseFloat(document.getElementById('newHiveWeight').value);

      if (!nameInput) {
        alert("Veuillez entrer un nom pour la ruche.");
        return;
      }

      const newKey = 'ruche_' + Date.now();
      const baseW = isNaN(weightInput) ? 40.0 : weightInput;

      dataHives[newKey] = {
        name: "🐝 " + nameInput,
        weight: baseW.toFixed(1),
        temp: "35.0",
        humidity: "60",
        labels7d: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
        data7d: [baseW, baseW, baseW, baseW, baseW, baseW, baseW],
        labels24h: ['00h', '04h', '08h', '12h', '16h', '20h'],
        data24h: [baseW, baseW, baseW, baseW, baseW, baseW]
      };

      saveToStorage();
      initSelector();
      changeHive(newKey);
      toggleAddForm();
      document.getElementById('newHiveName').value = '';
    }

    function saveDirectValues() {
      const w = parseFloat(document.getElementById('editWeight').value);
      const t = parseFloat(document.getElementById('editTemp').value);
      const h = parseInt(document.getElementById('editHumidity').value);

      if (!isNaN(w)) {
        dataHives[currentHive].weight = w.toFixed(1);
        const len7 = dataHives[currentHive].data7d.length;
        dataHives[currentHive].data7d[len7 - 1] = w;
      }
      if (!isNaN(t)) dataHives[currentHive].temp = t.toFixed(1);
      if (!isNaN(h)) dataHives[currentHive].humidity = h.toString();

      saveToStorage();
      changeHive(currentHive);
      toggleEditForm();
    }

    function deleteCurrentHive() {
      const keys = Object.keys(dataHives);
      if (keys.length <= 1) {
        alert("Vous devez garder au moins une ruche.");
        return;
      }
      if (confirm("Voulez-vous vraiment supprimer cette ruche de votre liste ?")) {
        delete dataHives[currentHive];
        saveToStorage();
        currentHive = Object.keys(dataHives)[0];
        initSelector();
        changeHive(currentHive);
      }
    }
  </script>
</body>
</html>
